name: PC parser

on:
  schedule:
        - cron: "7,22,37,52 * * * *"   # каждые 15 минут (GitHub может запускать с опозданием)
  workflow_dispatch:          # кнопка ручного запуска

permissions:
  contents: write             # чтобы сохранять seen.json обратно в репозиторий

concurrency:
  group: pc-parser
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить библиотеки
        run: pip install -r requirements.txt

      - name: Запустить парсер
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python pc_parser.py

      - name: Сохранить seen.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || (git commit -m "update seen.json" && git push)
